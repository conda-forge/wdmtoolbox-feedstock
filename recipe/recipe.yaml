schema_version: 1

context:
  name: wdmtoolbox
  version: "16.2.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 44d257d17d49a742b5be6784efe7194b57e6432328c6791f12b77538877262af

build:
  number: 3
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - wdmtoolbox = wdmtoolbox.wdmtoolbox:main

requirements:
  build:
    - python
    - if: not win
      then:
        - ${{ compiler('fortran') }}
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
    - if: win
      then:
        - ${{ compiler("m2w64_fortran") }}
        - ${{ compiler("m2w64_c") }}
        - ${{ stdlib("m2w64_c") }}
    - meson-python
    - meson >=1.5.1
    - numpy >=2.0
    - setuptools-scm
  host:
    - python
    - meson-python
    - meson >=1.5.1
    - numpy >=2.0
    - pip
  run:
    - python
    - cltoolbox >=2.0.0
    - dateparser
    - filelock
    - numpy >=1.26
    - pandas
    - pint !=0.21
    - pint-pandas
    - pydantic
    - python-dateutil
    - scipy
    - tabulate

tests:
  - python:
      imports:
        - wdmtoolbox
      pip_check: true
  - requirements:
      run:
        - pip
        - python
    script:
      - wdmtoolbox --help

about:
  summary: Read and write Watershed Data Management (WDM) files
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/wdmtoolbox/

extra:
  recipe-maintainers:
    - timcera
